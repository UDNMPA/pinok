<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ПИНОК.IO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // Fallback: if the primary CDN failed (network hiccup, blocker, etc.),
  // load THREE from a second CDN before the game script runs.
  if(typeof THREE === 'undefined'){
    document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js"><\/script>');
  }
</script>
<script>
  window.addEventListener('DOMContentLoaded', function(){
    if(typeof THREE === 'undefined'){
      var msg = document.createElement('div');
      msg.style.cssText = 'position:fixed;inset:0;background:#1a1b2e;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:sans-serif;z-index:9999;font-size:16px;';
      msg.textContent = 'Не удалось загрузить графический движок (three.js). Проверьте подключение к интернету и обновите страницу.';
      document.body.appendChild(msg);
    }
  });
</script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
  if(typeof Peer === 'undefined'){
    document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"><\/script>');
  }
</script>
<style>
  :root{
    --coral:#FF5D5D;
    --coral-dark:#E23F3F;
    --violet:#7C5CFF;
    --violet-dark:#5F3FE0;
    --yellow:#FFC93C;
    --yellow-dark:#E0A81A;
    --ink:#1A1B2E;
    --ink-2:#242640;
    --mint:#3DDC97;
    --paper:#F5F5FF;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:none; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--ink);
    font-family:'Baloo 2', sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
  }
  #app{ position:fixed; inset:0; width:100%; height:100%; }
  canvas#gameCanvas{ position:absolute; inset:0; display:block; width:100%; height:100%; }
  body.pc-mode canvas#gameCanvas{ cursor:crosshair; }
  body.pc-mode.pointer-locked canvas#gameCanvas{ cursor:none; }

  /* subtle vignette over the 3D view for a bit of atmosphere/depth — pure
     CSS, no render cost, sits above the canvas but below all HUD elements
     and never intercepts touches/clicks */
  #vignette{
    position:fixed; inset:0; z-index:10;
    pointer-events:none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.28) 100%);
  }

  /* ---------- START SCREEN ---------- */
  #startScreen{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 30% 20%, rgba(124,92,255,0.35), transparent 55%),
      radial-gradient(circle at 75% 80%, rgba(255,93,93,0.35), transparent 55%),
      var(--ink);
    gap:28px;
    padding:20px;
    text-align:center;
  }
  #startScreen .logo{
    font-weight:800;
    font-size:clamp(42px, 12vw, 84px);
    color:var(--paper);
    letter-spacing:1px;
    line-height:0.95;
    text-shadow: 0 6px 0 var(--coral-dark), 0 10px 18px rgba(0,0,0,0.4);
    transform: rotate(-2deg);
  }
  #startScreen .logo span{ color:var(--yellow); }
  #startScreen .sub{
    font-weight:700;
    font-size:clamp(14px,4vw,18px);
    color:rgba(245,245,255,0.65);
    max-width:320px;
  }
  #tapButton{
    margin-top:10px;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(20px, 5.5vw, 28px);
    color:var(--ink);
    background:var(--yellow);
    border:none;
    border-radius:26px;
    padding:22px 48px;
    box-shadow: 0 8px 0 var(--yellow-dark), 0 14px 24px rgba(0,0,0,0.35);
    cursor:pointer;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    animation: floaty 1.8s ease-in-out infinite;
  }
  #tapButton:active{
    transform: translateY(6px);
    box-shadow: 0 2px 0 var(--yellow-dark), 0 6px 14px rgba(0,0,0,0.3);
  }
  #tapButton:disabled{
    opacity:0.4;
    cursor:default;
    animation:none;
  }
  #tapButton:disabled:active{
    transform:none;
    box-shadow: 0 8px 0 var(--yellow-dark), 0 14px 24px rgba(0,0,0,0.35);
  }
  #nicknameInput{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:clamp(16px, 4.5vw, 20px);
    color:var(--paper);
    background:rgba(245,245,255,0.08);
    border:3px solid var(--violet);
    border-radius:16px;
    padding:14px 18px;
    text-align:center;
    text-transform:uppercase;
    width:100%;
    max-width:220px;
    outline:none;
  }
  #nicknameInput::placeholder{
    color:rgba(245,245,255,0.35);
    text-transform:none;
  }
  #nicknameInput:focus{
    border-color:var(--yellow);
  }
  @keyframes floaty{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-8px); }
  }
  #startScreen .hint{
    color:rgba(245,245,255,0.4);
    font-size:13px;
    font-weight:500;
    margin-top:4px;
  }

  /* ---------- HUD ---------- */
  #hud{
    position:fixed; inset:0; z-index:20;
    pointer-events:none;
    display:none;
  }
  #topBar{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:center; align-items:flex-start;
    flex-wrap:wrap;
    gap:8px;
    padding: max(14px, env(safe-area-inset-top)) 10px 0;
  }
  #topBadge{
    background:rgba(26,27,46,0.72);
    border:3px solid var(--yellow);
    border-radius:18px;
    color:var(--paper);
    font-weight:700;
    font-size:15px;
    padding:8px 18px;
    letter-spacing:0.5px;
    backdrop-filter: blur(4px);
  }
  #settingsBtn{
    pointer-events:auto;
    width:42px; height:42px;
    border-radius:14px;
    border:3px solid var(--yellow);
    background:rgba(26,27,46,0.72);
    backdrop-filter: blur(4px);
    font-size:19px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: transform 0.08s ease;
  }
  #settingsBtn:active{
    transform: scale(0.88);
  }
  #kickCounter{
    background:rgba(26,27,46,0.72);
    border:3px solid var(--coral);
    border-radius:18px;
    color:var(--paper);
    font-weight:800;
    font-size:15px;
    padding:8px 16px;
    letter-spacing:0.5px;
    backdrop-filter: blur(4px);
    display:flex; align-items:center; gap:6px;
    transition: transform 0.15s cubic-bezier(.2,1.4,.4,1);
  }
  #kickCounter.pulse{
    animation: kickCounterPulse 0.3s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes kickCounterPulse{
    0%{ transform:scale(1); }
    50%{ transform:scale(1.18); }
    100%{ transform:scale(1); }
  }
  /* narrow phones: shrink the badges and drop the long subtitle so the
     three top-bar items (badge, kick counter, settings) fit on one row
     without wrapping over the proximity hint below them */
  @media (max-width: 380px){
    #topBadge{ font-size:12px; padding:7px 12px; }
    #topBadge .subtitle{ display:none; }
    #kickCounter{ font-size:13px; padding:7px 12px; }
  }

  /* ---------- SETTINGS PANEL ---------- */
  #settingsPanel{
    position:fixed; inset:0; z-index:40;
    background:rgba(26,27,46,0.78);
    display:none;
    align-items:center; justify-content:center;
    pointer-events:auto;
    padding:20px;
  }
  #settingsPanel.show{ display:flex; }
  #settingsCard{
    background:var(--ink-2);
    border:4px solid var(--yellow);
    border-radius:24px;
    padding:26px 24px;
    width:100%;
    max-width:340px;
    box-shadow:0 14px 0 rgba(0,0,0,0.35);
  }
  .settingsTitle{
    color:var(--paper);
    font-weight:800;
    font-size:20px;
    text-align:center;
    margin-bottom:18px;
    letter-spacing:0.5px;
  }
  .settingsLabel{
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:rgba(245,245,255,0.85);
    font-weight:700;
    font-size:14px;
    margin-bottom:8px;
  }
  .settingsLabel span{
    color:var(--yellow);
    font-weight:800;
  }
  #sensSlider, #volSlider{
    width:100%;
    margin-bottom:22px;
    -webkit-appearance:none;
    appearance:none;
    height:10px;
    border-radius:6px;
    background:rgba(255,255,255,0.15);
    outline:none;
  }
  #sensSlider::-webkit-slider-thumb, #volSlider::-webkit-slider-thumb{
    -webkit-appearance:none;
    appearance:none;
    width:26px; height:26px;
    border-radius:50%;
    background:var(--coral);
    border:3px solid var(--coral-dark);
    cursor:pointer;
  }
  #sensSlider::-moz-range-thumb, #volSlider::-moz-range-thumb{
    width:26px; height:26px;
    border-radius:50%;
    background:var(--coral);
    border:3px solid var(--coral-dark);
    cursor:pointer;
  }
  .settingsDivider{
    height:2px;
    background:rgba(255,255,255,0.1);
    margin:4px 0 18px;
  }
  .qualityRow{
    display:flex;
    gap:8px;
    margin-bottom:22px;
  }
  .qualityBtn{
    flex:1;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:13px;
    color:rgba(245,245,255,0.85);
    background:rgba(255,255,255,0.08);
    border:3px solid rgba(255,255,255,0.15);
    border-radius:14px;
    padding:10px 4px;
    cursor:pointer;
    transition: transform 0.08s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .qualityBtn:active{ transform: translateY(2px); }
  .qualityBtn.active{
    color:var(--ink);
    background:var(--yellow);
    border-color:var(--yellow-dark);
  }
  #settingsCloseBtn{
    width:100%;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:17px;
    color:var(--ink);
    background:var(--mint);
    border:none;
    border-radius:16px;
    padding:14px;
    box-shadow: 0 6px 0 #2bb87d;
    cursor:pointer;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  #settingsCloseBtn:active{
    transform: translateY(4px);
    box-shadow: 0 2px 0 #2bb87d;
  }

  /* Multiplayer menu */
  #modeScreen, #roomScreen, #lobbyScreen{
    position:fixed; inset:0; z-index:55;
    display:none;
    align-items:center; justify-content:center;
    flex-direction:column;
    background:
      radial-gradient(circle at 30% 20%, rgba(124,92,255,0.35), transparent 55%),
      radial-gradient(circle at 75% 80%, rgba(255,93,93,0.35), transparent 55%),
      var(--ink);
    gap:18px;
    padding:24px;
    text-align:center;
  }
  #modeScreen.show, #roomScreen.show, #lobbyScreen.show{ display:flex; }
  .netTitle{
    font-weight:800;
    font-size:clamp(24px,7vw,34px);
    color:var(--paper);
  }
  .netSub{
    font-weight:600;
    font-size:14px;
    color:rgba(245,245,255,0.6);
    max-width:320px;
    margin-top:-8px;
  }
  .netBtn{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:18px;
    color:var(--ink);
    border:none;
    border-radius:18px;
    padding:16px 30px;
    width:100%;
    max-width:300px;
    cursor:pointer;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
